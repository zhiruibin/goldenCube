<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>挖个方块 · 十章关卡页样式预览</title>
<style>
  :root {
    --bg0: #2a3358;
    --bg1: #1c2440;
    --bg2: #12182c;
    --title: #FFE566;
    --sub: rgba(255,236,210,0.75);
    --muted: rgba(255,245,230,0.42);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    min-height: 100vh;
  }
  header { padding: 28px 24px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 28px; color: var(--title); letter-spacing: 0.04em; }
  header p { margin: 8px 0 0; color: var(--sub); font-size: 14px; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 18px; }

  .hardest {
    max-width: 720px;
    margin: 0 auto 28px;
    padding: 18px 18px 20px;
    border-radius: 24px;
    border: 1px solid rgba(255,200,87,0.55);
    background: rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .hardest::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% -20%, rgba(255,200,87,0.28), transparent 60%);
    pointer-events: none;
  }
  .hardest .tag {
    position: relative; z-index: 1;
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #1a1408;
    background: #FFC857;
    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 700;
  }
  .hardest h2 {
    position: relative; z-index: 1;
    margin: 10px 0 4px;
    font-size: 24px;
    color: #FFC857;
  }
  .hardest .sub {
    position: relative; z-index: 1;
    margin: 0 0 12px;
    color: var(--sub);
    font-size: 13px;
  }
  .hardest .board-wrap {
    position: relative; z-index: 1;
    display: flex;
    justify-content: center;
    padding: 8px 0 12px;
  }
  .hardest .meta {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .hardest .meta div {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .hardest .meta span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .hardest .meta b { color: #FFC857; font-size: 18px; }

  .section-title {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px 10px;
    color: var(--sub);
    font-size: 13px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
    padding: 12px 20px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .phone {
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,200,87,0.22);
    border-radius: 22px;
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .phone::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 55%);
    pointer-events: none;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .ch-title { font-size: 20px; font-weight: 700; color: var(--accent); margin: 0; }
  .ch-sub { margin: 2px 0 0; font-size: 12px; color: var(--sub); }
  .badge {
    font-size: 11px;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .intro {
    position: relative; z-index: 1;
    font-size: 12px; color: var(--muted); line-height: 1.45; min-height: 34px;
  }
  .boards {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .board-card { text-align: center; }
  .board-card .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .board-card .label strong { color: var(--accent); font-weight: 600; }
  canvas.board {
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #0a0e18;
    image-rendering: pixelated;
    width: 100%;
    height: auto;
  }
  .meta {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    font-size: 12px;
  }
  .meta div {
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 7px 9px;
  }
  .meta b { color: var(--accent); font-weight: 600; }
  .meta span { color: var(--muted); }
  @media (max-width: 520px) {
    .hardest .meta { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

    function drawBoard(canvas, stage, colors, cell) {
      const cols = 10, rows = 20;
      const pad = 2;
      cell = cell || 14;
      canvas.width = cols * cell + pad * 2;
      canvas.height = rows * cell + pad * 2;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0e18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = pad + c * cell;
          const y = pad + r * cell;
          const line = stage.rows[String(r)];
          const filled = line && line[c] === '#';
          ctx.fillStyle = filled ? colors.garbage : colors.hole;
          ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
          if (filled) {
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.fillRect(x + 1, y + 1, cell - 2, Math.max(2, cell * 0.2));
          }
        }
      }
      ctx.strokeStyle = colors.accent;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
      ctx.globalAlpha = 1;
    }

    // Hardest feature
    const H = DATA.hardest;
    const s = H.stage;
    const hardestEl = document.getElementById('hardest');
    hardestEl.innerHTML = `
      <span class="tag">全游戏最难关</span>
      <h2>第${s.chapterId}章 · ${H.chapterName} · 关${s.localId} ${s.name}</h2>
      <p class="sub">${H.theme} · ${H.intro}</p>
      <div class="board-wrap"><canvas id="hardCanvas"></canvas></div>
      <div class="meta">
        <div><span>最少消行</span><b>${s.minLines}</b></div>
        <div><span>金币阈值 T</span><b>${s.coinThreshold}</b></div>
        <div><span>垃圾格</span><b>${s.garbageCount}</b></div>
        <div><span>下落间隔</span><b>${H.drop}ms</b></div>
      </div>
    `;
    drawBoard(document.getElementById('hardCanvas'), s, {
      accent: H.accent, garbage: H.garbage, hole: H.hole
    }, 18);

    // Chapters
    const grid = document.getElementById('grid');
    DATA.chapters.forEach((ch) => {
      const el = document.createElement('article');
      el.className = 'phone';
      el.style.setProperty('--accent', ch.accent);
      el.innerHTML = `
        <div class="topbar">
          <div>
            <h2 class="ch-title">第${ch.id}章 · ${ch.name}</h2>
            <p class="ch-sub">${ch.theme}</p>
          </div>
          <span class="badge">${ch.colorLabel}</span>
        </div>
        <p class="intro">${ch.intro}</p>
        <div class="boards">
          <div class="board-card">
            <div class="label">第1关 · <strong>${ch.firstStage.name}</strong> · ${ch.firstStage.kind || ""}</div>
            <canvas class="board mid"></canvas>
          </div>
          <div class="board-card">
            <div class="label">最后一关 · <strong>${ch.lastStage.name}</strong> · ${ch.lastStage.kind || ""}</div>
            <canvas class="board boss"></canvas>
          </div>
        </div>
        <div class="meta">
          <div><span>第1关 minLines / T</span><br><b>${ch.firstStage.minLines} / ${ch.firstStage.coinThreshold}</b></div>
          <div><span>最后一关 minLines / T</span><br><b>${ch.lastStage.minLines} / ${ch.lastStage.coinThreshold}</b></div>
          <div><span>章内 minLines</span><br><b>${ch.mlRange}</b></div>
          <div><span>章内 T 范围</span><br><b>${ch.TRange}</b></div>
        </div>
      `;
      grid.appendChild(el);
      const colors = { accent: ch.accent, garbage: ch.garbage, hole: ch.hole };
      drawBoard(el.querySelector('canvas.mid'), ch.firstStage, colors, 11);
      drawBoard(el.querySelector('canvas.boss'), ch.lastStage, colors, 11);
    });
  </script>
</body>
</html>
